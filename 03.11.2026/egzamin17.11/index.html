<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Pola figur</title>
    <link rel="stylesheet" href="styl.css">
</head>
<body>
    <header>
        <h2>Pola figur płaskich</h2>
    </header>

    <main>
        <nav>
            <h3>MENU</h3>
            <ul>
                <li><a href="index.html">Prostokąt i trójkąt</a></li>
                <li><a href="kolo.html">Okrąg i koło</a></li>
            </ul>
        </nav>

        <section>
            <img src="1d.bmp" alt="Figura" id="duzaFigura"><br>
            <img src="1m.bmp" alt="Wybierz trójkąt" class="miniatura" onclick="zmienFigure('1d.bmp')">
            <img src="2m.bmp" alt="Wybierz prostokąt" class="miniatura" onclick="zmienFigure('2d.bmp')">
        </section>

        <aside>
            <h3>Pole prostokąta / pole trójkąta</h3>
            <label for="bokA">Bok prostokąta / podstawa trójkąta:</label><br>
            <input type="number" id="bokA"><br>

            <label for="bokB">Drugi bok prostokąta / wysokość trójkąta:</label><br>
            <input type="number" id="bokB"><br>

            <button type="button" onclick="obliczPole()">Oblicz</button>
            <p id="wynik"></p>
        </aside>
    </main>

    <footer>
        <p>Autor: Krzysztof</p>
    </footer>

    <script src="index.js"></script>
</body>
</html>
